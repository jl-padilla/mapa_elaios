<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="utf-8">

<title>Mapa de excursiones ELAIOS</title>

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f5;
    color: #263238;
}


/* ========================================================
   MARCADOR ELAIOS
   ======================================================== */

.marker-elaios {
    width: 46px;
    height: 46px;

    border-radius: 50%;

    background: white;

    border: 3px solid #7b2cbf;

    display: flex;

    justify-content: center;
    align-items: center;

    box-shadow:
        0 4px 12px rgba(0,0,0,.35);
}

.marker-elaios img {
    width: 32px;
    height: 32px;
    object-fit: contain;
}


/* ========================================================
   CABECERA
   ======================================================== */

.entidad-header {
    display: grid;

    grid-template-columns:
        260px 1fr 320px;

    align-items: center;

    gap: 24px;

    padding: 22px 28px;

    background: white;

    border-bottom:
        1px solid #e5e5e5;
}


.entidad-header-imagen {
    background:

        linear-gradient(
            90deg,
            rgba(255,255,255,0.97) 0%,
            rgba(255,255,255,0.92) 48%,
            rgba(255,255,255,0.30) 100%
        ),

        url(
            "assets/cabecera/elaios_montana.jpg"
        );

    background-size: cover;
    background-position: center;
}


.entidad-logo img {
    max-width: 230px;
    height: auto;
}


.entidad-titulo h1 {
    margin: 0;

    font-size: 34px;

    color: #0f3d2e;
}


.entidad-titulo p {
    margin: 6px 0 0;

    font-size: 18px;

    color: #667085;
}


.entidad-contacto {
    border-left:
        2px solid #7b2cbf;

    padding-left: 22px;

    font-size: 15px;

    line-height: 1.7;

    background:
        rgba(255,255,255,0.75);

    border-radius: 10px;

    padding-top: 10px;
    padding-bottom: 10px;
}


.entidad-contacto a {
    color: #0f3d2e;

    font-weight: bold;

    text-decoration: none;
}


.entidad-contacto a:hover {
    text-decoration: underline;
}


/* ========================================================
   ESTADÍSTICAS
   ======================================================== */

.stats {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;

    padding: 16px;
}


.stat {
    background: white;

    border-radius: 12px;

    padding: 14px;

    box-shadow:
        0 1px 5px rgba(0,0,0,.12);

    text-align: center;
}


.stat strong {
    display: block;

    font-size: 25px;

    color: #1f6f43;
}


/* ========================================================
   MAPA + PANEL
   ======================================================== */

.layout {
    display: grid;

    grid-template-columns:
        330px 1fr;

    height: 720px;
}


aside {
    background: white;

    padding: 16px;

    overflow: auto;

    border-right:
        1px solid #ddd;
}


#map {
    height: 720px;
}


label {
    display: block;

    margin-top: 10px;

    font-size: 13px;

    font-weight: bold;
}


input,
select {
    width: 100%;

    box-sizing: border-box;

    padding: 9px;

    margin-top: 5px;

    border:
        1px solid #ccc;

    border-radius: 8px;
}


button {
    width: 100%;

    margin-top: 12px;

    padding: 10px;

    background: #1f6f43;

    color: white;

    border: 0;

    border-radius: 8px;

    font-weight: bold;

    cursor: pointer;
}


.list-item {
    padding: 10px;

    border-bottom:
        1px solid #eee;

    cursor: pointer;
}


.list-item:hover {
    background: #eef8f1;
}


.list-item strong {
    color: #1f6f43;
}


/* ========================================================
   POPUP
   ======================================================== */

.popup h3 {
    margin: 0 0 8px;

    color: #1f6f43;
}


.meta {
    margin: 4px 0;
}


.logos img {
    height: 38px;

    margin:
        6px 8px 6px 0;

    vertical-align: middle;
}


.gallery {
    display: flex;

    gap: 7px;

    overflow-x: auto;

    max-width: 360px;

    margin-top: 8px;
}


.gallery img {
    width: 105px;

    height: 78px;

    object-fit: cover;

    border-radius: 8px;

    border:
        1px solid #ddd;
}


.track {
    display: inline-block;

    margin-top: 10px;

    padding: 8px 10px;

    background: #1f6f43;

    color: white !important;

    text-decoration: none;

    border-radius: 8px;
}


/* ========================================================
   MENSAJE SIN REGISTROS
   ======================================================== */

.sin-registros {
    margin-top: 15px;

    padding: 14px;

    background: #f6f2fa;

    border-left:
        4px solid #7b2cbf;

    border-radius: 8px;

    color: #4a3557;

    line-height: 1.4;
}


/* ========================================================
   MÓVIL
   ======================================================== */

@media (max-width: 700px) {

    body {
        font-size: 15px;
    }


    .entidad-header {
        grid-template-columns: 1fr;

        padding: 16px;

        gap: 12px;

        text-align: center;
    }


    .entidad-logo img {
        max-width: 180px;
    }


    .entidad-titulo h1 {
        font-size: 24px;
    }


    .entidad-titulo p {
        font-size: 15px;
    }


    .entidad-contacto {
        font-size: 14px;

        border-left: 0;

        border-top:
            2px solid #7b2cbf;

        padding-left: 0;

        padding-top: 12px;
    }


    .stats {
        grid-template-columns:
            repeat(3, 1fr);

        padding: 10px;

        gap: 8px;
    }


    .stat {
        padding: 10px 5px;

        font-size: 12px;
    }


    .stat strong {
        font-size: 21px;
    }


    .layout {
        display: flex;

        flex-direction: column;

        height: auto;
    }


    aside {
        max-height: 360px;

        overflow: auto;

        border-right: 0;

        border-bottom:
            1px solid #ddd;
    }


    #map {
        height: 70vh;

        min-height: 420px;

        width: 100%;
    }


    .gallery {
        max-width: 280px;
    }


    .gallery img {
        width: 88px;

        height: 66px;
    }


    .leaflet-popup-content {
        max-width: 280px;
    }

}

</style>

</head>

        <label>

        <label>
            Dificultad

        <label>

        <select id="filtro-logo">

</div>

, "tipo": "excursion", "dificultad": "media", "track": "https://loc.wiki/t/241354682?h=2zl67lldzo&wa=so&la=es", "lat": 41.3967627, "lon": -1.3329461, "logos": ["assets/logos/elaios.png"], "fotos": []}];

const map = L.map("map");


L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap"
    }
).addTo(map);


const markersLayer =
    L.layerGroup().addTo(map);


let markerById = {};


// ========================================================
// ICONO ELAIOS
// ========================================================

const iconoElaios = L.divIcon({

    html: `
        <div class="marker-elaios">
            <img
                src="assets/logos/elaios.png"
                alt="ELAIOS"
            >
        </div>
    `,

    className: "",

    iconSize: [46, 46],

    iconAnchor: [23, 46],

    popupAnchor: [0, -40]

});


// ========================================================
// FUNCIONES AUXILIARES JAVASCRIPT
// ========================================================

function unique(arr) {

    return [
        ...new Set(
            arr.filter(Boolean)
        )
    ].sort();

}


function basename(path) {

    if (!path) return "";

    return path
        .split("/")
        .pop()
        .split("?")[0]
        .replace(
            /\.(png|jpg|jpeg|webp|gif)$/i,
            ""
        );

}


function nombreBonitoLogo(path) {

    return basename(path)
        .replaceAll("_", " ")
        .toUpperCase();

}


function formatearFecha(fecha) {

    if (!fecha) return "-";

    const partes = fecha.split("_");

    if (partes.length === 3) {
        return `${partes[2]}-${partes[1]}-${partes[0]}`;
    }

    return fecha;

}


function fillSelect(id, values) {

    const sel =
        document.getElementById(id);

    values.forEach(v => {

        const opt =
            document.createElement("option");

        opt.value = v;

        opt.textContent = v;

        sel.appendChild(opt);

    });

}


// ========================================================
// POPUP
// ========================================================

function popupHtml(e) {

    const logos =
        (e.logos || [])
        .map(
            src =>
            `<img
                src="${src}"
                title="${nombreBonitoLogo(src)}"
                onerror="this.style.display='none'"
            >`
        )
        .join("");


    const fotos =
        (e.fotos || [])
        .map(
            src =>
            `<a
                href="${src}"
                target="_blank"
                rel="noopener noreferrer"
            >
                <img
                    src="${src}"
                    onerror="this.style.display='none'"
                >
            </a>`
        )
        .join("");


    const bloqueLogos =
        logos
        ? `<div class="logos">${logos}</div>`
        : "";


    const bloqueFotos =
        fotos
        ? `<div class="gallery">${fotos}</div>`
        : "<p><em>Sin fotos cargadas</em></p>";


    const track =
        e.track
        ? `<a
              class="track"
              href="${e.track}"
              target="_blank"
              rel="noopener noreferrer"
           >
              Ver track
           </a>`
        : "";


    return `

        <div class="popup">

            <h3>
                ${e.nombre}
            </h3>

            <div class="meta">
                <b>Fecha:</b>
                ${formatearFecha(e.fecha)}
            </div>

            <div class="meta">
                <b>Población:</b>
                ${e.poblacion || "-"}
            </div>

            <div class="meta">
                <b>Provincia:</b>
                ${e.provincia || "-"}
            </div>

            <div class="meta">
                <b>Tipo:</b>
                ${e.tipo || "-"}
            </div>

            <div class="meta">
                <b>Dificultad:</b>
                ${e.dificultad || "-"}
            </div>

            ${bloqueLogos}

            ${bloqueFotos}

            ${track}

        </div>

    `;

}


// ========================================================
// FILTROS
// ========================================================

function aplicarFiltros() {

    const q =
        document
        .getElementById("buscar")
        .value
        .toLowerCase()
        .trim();


    const anio =
        document
        .getElementById("filtro-anio")
        .value;


    const provincia =
        document
        .getElementById("filtro-provincia")
        .value;


    const tipo =
        document
        .getElementById("filtro-tipo")
        .value;


    const dificultad =
        document
        .getElementById("filtro-dificultad")
        .value;


    const logo =
        document
        .getElementById("filtro-logo")
        .value;


    return excursiones.filter(e => {

        const texto = `
            ${e.nombre}
            ${e.poblacion}
            ${e.provincia}
            ${e.tipo}
            ${e.dificultad}
        `.toLowerCase();


        const logos =
            (e.logos || [])
            .map(basename);


        return (

            (!q ||
                texto.includes(q)
            )

            &&

            (!anio ||
                e.anio == anio
            )

            &&

            (!provincia ||
                e.provincia == provincia
            )

            &&

            (!tipo ||
                e.tipo == tipo
            )

            &&

            (!dificultad ||
                e.dificultad == dificultad
            )

            &&

            (!logo ||
                logos.includes(logo)
            )

        );

    });

}


// ========================================================
// PINTAR MAPA
// ========================================================

function pintar() {

    const datos =
        aplicarFiltros();


    markersLayer.clearLayers();


    markerById = {};


    const bounds = [];


    const excursionesReales =
        datos.filter(
            e => !e.sin_registros
        );


    // ----------------------------------------------------
    // COORDENADAS REPETIDAS
    // ----------------------------------------------------
    // Si varias excursiones tienen exactamente el mismo punto,
    // las separamos SOLO visualmente unos metros alrededor del
    // punto real. Así todos los marcadores quedan accesibles.

    const gruposCoordenadas = {};

    excursionesReales.forEach(e => {
        if (e.lat === null || e.lon === null) return;

        const clave = `${e.lat.toFixed(6)},${e.lon.toFixed(6)}`;

        if (!gruposCoordenadas[clave]) {
            gruposCoordenadas[clave] = [];
        }

        gruposCoordenadas[clave].push(e.id);
    });


    // ----------------------------------------------------
    // CREAR MARCADORES
    // ----------------------------------------------------

    excursionesReales.forEach(e => {

        // Seguridad adicional:
        // nunca intentamos dibujar coordenadas vacías.
        if (
            e.lat === null ||
            e.lon === null
        ) {
            return;
        }

        let latVisual = e.lat;
        let lonVisual = e.lon;

        const clave = `${e.lat.toFixed(6)},${e.lon.toFixed(6)}`;
        const grupo = gruposCoordenadas[clave] || [];

        if (grupo.length > 1) {
            const posicion = grupo.indexOf(e.id);
            const angulo = (2 * Math.PI * posicion) / grupo.length;
            const radio = 0.00018;

            latVisual = e.lat + Math.sin(angulo) * radio;
            lonVisual = e.lon + Math.cos(angulo) * radio;
        }


        const marker =
            L.marker(
                [latVisual, lonVisual],
                {
                    icon: iconoElaios
                }
            )

            .bindPopup(
                popupHtml(e),
                {
                    maxWidth: 420
                }
            )

            .bindTooltip(
                e.nombre
            );


        marker.addTo(
            markersLayer
        );


        markerById[e.id] =
            marker;


        bounds.push(
            [latVisual, lonVisual]
        );

    });


    // ----------------------------------------------------
    // AJUSTAR MAPA
    // ----------------------------------------------------

    if (bounds.length) {

        map.fitBounds(
            bounds,
            {
                padding: [30, 30]
            }
        );

    } else {

        map.setView(
            [41.65, -0.9],
            7
        );

    }


    // ----------------------------------------------------
    // CONTADOR Y MENSAJES
    // ----------------------------------------------------

    const contador =
        document.getElementById(
            "contador"
        );


    const mensaje =
        document.getElementById(
            "mensaje-sin-registros"
        );


    mensaje.innerHTML = "";


        if (excursionesReales.length === 0
        ) {

        contador.textContent =
            "0 excursiones visibles";


        const anioSeleccionado =
            document
            .getElementById(
                "filtro-anio"
            )
            .value;


        const anioSinRegistros =
            anioSeleccionado &&
            excursiones.some(
                e =>
                    e.anio == anioSeleccionado &&
                    e.sin_registros
            );

        if (anioSinRegistros) {

            mensaje.innerHTML = `

                <div class="sin-registros">

                    <strong>
                        ${anioSeleccionado}
                    </strong>

                    <br>

                    No hay excursiones
                    registradas para este año.

                </div>

            `;

        } else {

            mensaje.innerHTML = `

                <div class="sin-registros">

                    No hay excursiones
                    que coincidan con
                    los filtros seleccionados.

                </div>

            `;

        }

    } else {

        contador.textContent =
            `${excursionesReales.length} excursiones visibles`;

    }


    // ----------------------------------------------------
    // LISTA LATERAL
    // ----------------------------------------------------

    document
        .getElementById("lista")
        .innerHTML =

        excursionesReales
        .map(e => `

            <div
                class="list-item"
                data-id="${e.id}"
            >

                <strong>
                    ${e.nombre}
                </strong>

                <br>

                <small>
                    ${formatearFecha(e.fecha)}
                    ·
                    ${e.poblacion || ""}
                </small>

            </div>

        `)
        .join("");


    // ----------------------------------------------------
    // CLIC EN LA LISTA
    // ----------------------------------------------------

    document
        .querySelectorAll(
            ".list-item"
        )
        .forEach(item => {

            item.addEventListener(
                "click",
                () => {

                    const m =
                        markerById[
                            item.dataset.id
                        ];


                    if (m) {

                        map.setView(
                            m.getLatLng(),
                            13
                        );

                        m.openPopup();

                    }

                }
            );

        });

}

// INICIALIZACIÓN

function inicializar() {

    // ----------------------------------------------------
    // FILTRO AÑOS
    // Incluye también años SIN_REGISTROS
    // ----------------------------------------------------

    fillSelect(
        "filtro-anio",
        unique(
            excursiones.map(
                e => e.anio
            )
        )
    );


    // ----------------------------------------------------
    // RESTO DE FILTROS
    // Solo utilizamos excursiones reales.
    // ----------------------------------------------------

    const excursionesRealesTotal =
        excursiones.filter(
            e => !e.sin_registros
        );


    fillSelect(
        "filtro-provincia",
        unique(
            excursionesRealesTotal.map(
                e => e.provincia
            )
        )
    );


    fillSelect(
        "filtro-tipo",
        unique(
            excursionesRealesTotal.map(
                e => e.tipo
            )
        )
    );


    fillSelect(
        "filtro-dificultad",
        unique(
            excursionesRealesTotal.map(
                e => e.dificultad
            )
        )
    );


    fillSelect(
        "filtro-logo",
        unique(
            excursionesRealesTotal.flatMap(
                e =>
                (e.logos || [])
                .map(basename)
            )
        )
    );


    // ----------------------------------------------------
    // ESTADÍSTICAS
    // ----------------------------------------------------

    document
        .getElementById(
            "stat-exc"
        )
        .textContent =
        excursionesRealesTotal.length;


    // Aquí SÍ contamos 2006/2007 porque forman parte
    // del histórico aunque no tengan excursiones.
    document
        .getElementById(
            "stat-anios"
        )
        .textContent =
        unique(
            excursiones.map(
                e => e.anio
            )
        ).length;


    // Provincias únicamente de excursiones reales.
    document
        .getElementById(
            "stat-prov"
        )
        .textContent =
        unique(
            excursionesRealesTotal.map(
                e => e.provincia
            )
        ).length;


    // ----------------------------------------------------
    // EVENTOS DE FILTROS
    // ----------------------------------------------------

    [
        "buscar",
        "filtro-anio",
        "filtro-provincia",
        "filtro-tipo",
        "filtro-dificultad",
        "filtro-logo"
    ]

    .forEach(id =>

        document
        .getElementById(id)
        .addEventListener(
            "input",
            pintar
        )

    );


    // ----------------------------------------------------
    // LIMPIAR FILTROS
    // ----------------------------------------------------

    document
        .getElementById(
            "limpiar"
        )
        .addEventListener(
            "click",
            () => {

                document
                    .getElementById(
                        "buscar"
                    )
                    .value = "";


                [
                    "filtro-anio",
                    "filtro-provincia",
                    "filtro-tipo",
                    "filtro-dificultad",
                    "filtro-logo"
                ]

                .forEach(id =>

                    document
                        .getElementById(id)
                        .value = ""

                );


                pintar();

            }
        );


    // ----------------------------------------------------
    // PRIMER DIBUJADO
    // ----------------------------------------------------

    pintar();

}


inicializar();


</script>


</body>

</html>
